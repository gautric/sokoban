<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiro's Ghost Sokoban</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <div id="ui-overlay">

      <!-- Menu Screen -->
      <div id="menu-screen">
        <h1 class="game-title">Kiro's Ghost<br>Sokoban</h1>
        <div class="menu-ghost" data-testid="menu-ghost"><img src="assets/ghostv2.svg" alt="Kiro Ghost" class="menu-ghost-img"></div>
        <div class="menu-buttons"></div>
        <div class="how-to-play-modal" id="how-to-play" style="display:none">
          <h3>HOW TO PLAY</h3>
          <p>Push all boxes onto targets!</p>
          <p>Arrows: Move</p>
          <p>Q/E: Rotate camera</p>
          <p>Z: Undo | R: Restart</p>
          <p>M: Mute | Esc: Pause</p>
          <p>Mouse: Drag to rotate, Scroll to zoom</p>
        </div>
      </div>

      <!-- Level Select Screen -->
      <div id="level-select-screen">
        <h2>SELECT LEVEL</h2>
        <div class="level-grid"></div>
        <div class="level-nav" style="display:none">
          <button class="pixel-btn" id="level-prev" data-testid="btn-<-prev">&lt; Prev</button>
          <span class="page-label" id="level-page-label"></span>
          <button class="pixel-btn" id="level-next" data-testid="btn-next->">Next &gt;</button>
        </div>
        <div class="level-select-back"></div>
      </div>

      <!-- HUD -->
      <div id="hud">
        <div class="hud-row"><span class="hud-label">Level:</span> <span id="hud-level">-</span></div>
        <div class="hud-row"><span class="hud-label">Moves:</span> <span id="hud-moves">0</span></div>
        <div class="hud-row"><span class="hud-label">Pushes:</span> <span id="hud-pushes">0</span></div>
        <div class="hud-row"><span class="hud-label">Time:</span> <span id="hud-timer">00:00</span></div>
        <div class="hud-row"><span class="hud-label">Music:</span> <span id="hud-music" class="hud-toggle" data-testid="btn-music-toggle">ON</span></div>
      </div>

      <!-- Pause Menu -->
      <div id="pause-menu">
        <h2>PAUSED</h2>
        <div class="pause-buttons"></div>
      </div>

      <!-- Level Complete -->
      <div id="level-complete">
        <h2>LEVEL COMPLETE!</h2>
        <div class="stars" id="complete-stars"></div>
        <div class="stats">
          <div>Moves: <span id="complete-moves"></span></div>
          <div>Pushes: <span id="complete-pushes"></span></div>
          <div>Time: <span id="complete-time"></span></div>
        </div>
        <div class="confetti-container" data-testid="confetti"></div>
        <div class="complete-buttons"></div>
      </div>

    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
