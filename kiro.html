<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiro</title>
  <style>
    body { margin: 0; background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    .scene { perspective: 800px; }
    #kiro {
      width: 50vmin;
      height: 50vmin;
      filter: drop-shadow(0 0 40px rgba(255,255,255,0.3)) drop-shadow(0 0 80px rgba(255,255,255,0.15));
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, filter 0.3s ease;
      will-change: transform;
    }
    .glow {
      position: absolute;
      width: 55vmin; height: 55vmin;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 40%, transparent 70%);
      pointer-events: none;
      transition: transform 0.1s ease-out, opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="glow" id="glow"></div>
    <svg id="kiro" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="c"><rect width="500" height="600"/></clipPath></defs><g clip-path="url(#c)"><g transform="matrix(1.4576,0,0,1.4576,265.367,317.039)"><g transform="matrix(-1,0,0,1,0,0)"><path fill="#fff" d="M124.872,-2.098C121.933,-31.071 121.463,-58.981 113.863,-83.37C81.313,-222.739 -107.797,-222.6 -145.633,-84.076C-201.448,150.349 133.689,84.831 124.872,-2.098z"/></g></g><g transform="matrix(1.4576,0,0,1.4576,265.367,317.039)"><g transform="matrix(-1,0,0,1,0,0)"><path fill="#fff" d="M-9.994,160.678C7.798,54.302 -74.528,-129.561 -145.633,-84.076C-151.149,-63.764 -172.644,34.713 -119.418,131.246C-95.27,175.043 -27.933,217.214 -9.994,160.678z"/></g></g><g transform="matrix(1.4576,0,0,1.4576,265.367,317.039)"><g transform="matrix(-1,0,0,1,0,0)"><path fill="#fff" d="M-9.994,160.677C51.057,211.092 133.831,189.493 94.958,103.345C94.958,103.345 29.176,-50.213 -20.944,-22.834C-74.722,6.544 -64.237,96.151 -9.994,160.677z"/></g></g><g transform="matrix(1.4576,0,0,1.4576,265.367,317.039)"><g transform="matrix(-1,0,0,1,0,0)"><path fill="#fff" d="M100.242,105.752C100.242,105.757 100.242,105.736 100.242,105.736C156.154,126.169 161.723,86.208 149.883,66.353C112.421,3.534 128.201,-32.828 113.863,-83.37C81.313,-222.739 -15.528,40.717 100.242,105.752z"/></g></g><g id="eyes"><g id="eye-l" transform="matrix(1.4576,0,0,1.4576,263.3,317.039)"><g transform="matrix(1,0,0,1,17.992,-53.739)"><path fill="#000" d="M-18.456,-0.001C-18.456,11.057 -16.138,29.607 -0.615,29.607C-0.615,29.607 -0.612,29.607 -0.612,29.607C11.327,29.607 18.456,18.54 18.456,-0.001C18.456,-9.814 16.48,-17.707 12.741,-22.831C9.459,-27.328 4.807,-29.607 -0.615,-29.607C-6.037,-29.607 -10.3,-27.363 -13.28,-22.94C-16.667,-17.913 -18.456,-9.981 -18.456,-0.001z"/></g></g><g id="eye-r" transform="matrix(1.4576,0,0,1.4576,265.367,317.039)"><g transform="matrix(1,0,0,1,81.822,-53.739)"><path fill="#000" d="M-18.456,-0.001C-18.456,11.057 -16.138,29.607 -0.615,29.607C-0.615,29.607 -0.612,29.607 -0.612,29.607C11.327,29.607 18.456,18.54 18.456,-0.001C18.456,-9.814 16.48,-17.707 12.741,-22.831C9.459,-27.328 4.807,-29.607 -0.615,-29.607C-6.037,-29.607 -10.3,-27.363 -13.28,-22.94C-16.667,-17.913 -18.456,-9.981 -18.456,-0.001z"/></g></g></g><g id="blinks" style="display:none"><g transform="matrix(-1,0,0,1,303,284.139)"><path stroke-linecap="round" fill="none" stroke="#000" stroke-width="22" d="M-102.75,-72C-102.75,-72 -56,-72.003 -56,-72.003"/></g><g transform="matrix(-1,0,0,1,213.001,284.139)"><path stroke-linecap="round" fill="none" stroke="#000" stroke-width="22" d="M-102.75,-72C-102.75,-72 -56,-72.003 -56,-72.003"/></g></g></g></svg>
  </div>

  <script>
    const kiro = document.getElementById('kiro');
    const glow = document.getElementById('glow');
    const eyes = document.getElementById('eyes');
    const blinks = document.getElementById('blinks');

    // Smooth 3D perspective tilt following mouse (kiro.dev style)
    let targetRX = 0, targetRY = 0, currentRX = 0, currentRY = 0;

    document.addEventListener('mousemove', e => {
      const mx = (e.clientX / window.innerWidth - 0.5) * 2;
      const my = (e.clientY / window.innerHeight - 0.5) * 2;
      targetRY = mx * 20;
      targetRX = my * -15;
      // Eyes follow cursor
      eyes.setAttribute('transform', `translate(${mx * 10},${my * 6})`);
      blinks.setAttribute('transform', `translate(${mx * 10},${my * 6})`);
      // Glow shifts opposite to mouse for depth
      glow.style.transform = `translate(${mx * -20}px, ${my * -20}px)`;
      glow.style.opacity = 0.6 + Math.abs(mx) * 0.4;
    });

    // Smooth animation loop with lerp
    function animate() {
      currentRX += (targetRX - currentRX) * 0.08;
      currentRY += (targetRY - currentRY) * 0.08;
      // Add gentle idle float
      const t = performance.now() / 1000;
      const floatY = Math.sin(t * 0.8) * 8;
      const floatR = Math.sin(t * 0.5) * 2;
      kiro.style.transform = `rotateX(${currentRX}deg) rotateY(${currentRY + floatR}deg) translateY(${floatY}px)`;
      requestAnimationFrame(animate);
    }
    animate();

    // Blink
    function blink() {
      eyes.style.display = 'none';
      blinks.style.display = 'block';
      setTimeout(() => { eyes.style.display = 'block'; blinks.style.display = 'none'; }, 120);
      setTimeout(blink, 2000 + Math.random() * 3000);
    }
    setTimeout(blink, 1500);
  </script>
</body>
</html>
