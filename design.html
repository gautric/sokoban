<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sokoban - Design Board</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPixelatedPass } from 'three/addons/postprocessing/RenderPixelatedPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { BoardRenderer } from './src/rendering/BoardRenderer.js';
    import { PlayerRenderer } from './src/rendering/PlayerRenderer.js';
    import { IsometricCamera } from './src/rendering/IsometricCamera.js';
    import { PIXEL_SIZE_DEFAULT } from './src/config.js';

    // Fake board: row of items — wall, box, greenBox, target, player
    // Layout (7 wide x 3 tall, padded with floors):
    //   F F F F F F F F F F F
    //   F W F B F G F T F . F
    //   F F F F F F F F F F F
    const W=1, F=2, T=3; // TileType: WALL=1, FLOOR=2, TARGET=3
    const E=0, B=2; // EntityType: NONE=0, BOX=2
    const fakeBoard = {
      width: 11, height: 3,
      tiles: [
        [F,F,F,F,F,F,F,F,F,F,F],
        [F,W,F,F,F,F,F,T,F,F,F],
        [F,F,F,F,F,F,F,F,F,F,F],
      ],
      entities: [
        [E,E,E,E,E,E,E,E,E,E,E],
        [E,E,E,B,E,B,E,E,E,E,E],
        [E,E,E,E,E,E,E,E,E,E,E],
      ],
      playerPos: { x: 9, y: 1 },
      getTile(x, y) { return this.tiles[y]?.[x]; },
    };
    // Box at (5,1) is on a target-like position — override tile for green box
    fakeBoard.tiles[1][5] = T;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    // Lighting — same as GameScene
    scene.add(new THREE.AmbientLight(0xFFE8CC, 0.5));
    const dirLight = new THREE.DirectionalLight(0xFFFFFF, 0.8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 0.1;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    scene.add(dirLight);
    scene.add(dirLight.target);

    // Reuse game renderers
    const boardRenderer = new BoardRenderer(scene);
    boardRenderer.buildBoard(fakeBoard);

    const playerRenderer = new PlayerRenderer(scene);
    playerRenderer.init();
    playerRenderer.setPosition(fakeBoard.playerPos.x, fakeBoard.playerPos.y);

    // Camera
    const isoCamera = new IsometricCamera();
    isoCamera.init(fakeBoard.width, fakeBoard.height);
    isoCamera.tiltDeg *= 0.72;
    isoCamera.zoomPercent = 44;
    isoCamera._updateCameraPosition();

    // Renderer + pixelation
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.shadowMap.enabled = true;
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    document.getElementById('container').appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    const pixelPass = new RenderPixelatedPass(PIXEL_SIZE_DEFAULT, scene, isoCamera.getCamera());
    pixelPass.normalEdgeStrength = 0.3;
    pixelPass.depthEdgeStrength = 0.4;
    composer.addPass(pixelPass);
    composer.addPass(new OutputPass());

    function updateLight() {
      const a = THREE.MathUtils.degToRad(isoCamera.getRotationAngle() + 45 - 90);
      const c = isoCamera.center;
      dirLight.position.set(c.x + Math.sin(a) * 10, 10, c.z + Math.cos(a) * 10);
      dirLight.target.position.copy(c);
    }
    updateLight();

    // Space to rotate
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ') { e.preventDefault(); isoCamera.rotateRight(); }
    });

    // Animate
    let last = performance.now();
    function animate() {
      const now = performance.now();
      const dt = now - last;
      last = now;
      isoCamera.update(dt);
      playerRenderer.update(dt);
      playerRenderer.setCameraAngle(isoCamera.getRotationAngle(), isoCamera.getCamera());
      updateLight();
      pixelPass.camera = isoCamera.getCamera();
      composer.render();
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
