<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sokoban - Game Objects Design</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #eee; font-family: 'Courier New', monospace; padding: 40px; }
    h1 { text-align: center; margin-bottom: 40px; color: #7B61FF; font-size: 2em; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 2px solid #0f3460;
    }
    .card h2 { color: #7B61FF; margin-bottom: 15px; font-size: 1.1em; }
    .card canvas { border-radius: 8px; display: block; margin: 0 auto; }
    .card p { margin-top: 10px; font-size: 0.85em; color: #aaa; }
  </style>
</head>
<body>
  <h1>🎮 Sokoban — Game Objects</h1>
  <div class="grid" id="grid"></div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { TileFactory } from './src/rendering/TileFactory.js';
    import { TILE_SIZE, WALL_HEIGHT, BOX_SIZE } from './src/config.js';

    const S = 200;

    function renderMesh(mesh, camOpts = {}) {
      const scene = new THREE.Scene();
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(2, 3, 2);
      scene.add(dir);
      scene.add(mesh);

      const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 10);
      const d = camOpts.dist || 2.5;
      const y = camOpts.y || 1.5;
      cam.position.set(d, y, d);
      cam.lookAt(mesh.position.clone().add(new THREE.Vector3(0, camOpts.lookY || 0, 0)));

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(S, S);
      renderer.setClearColor(0x000000, 0);
      renderer.render(scene, cam);
      return renderer.domElement;
    }

    function card(title, desc, canvas) {
      const div = document.createElement('div');
      div.className = 'card';
      const h2 = document.createElement('h2');
      h2.textContent = title;
      const p = document.createElement('p');
      p.textContent = desc;
      div.appendChild(h2);
      div.appendChild(canvas);
      div.appendChild(p);
      document.getElementById('grid').appendChild(div);
    }

    // Player
    const playerCard = () => {
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, S, S);
      const img = new Image();
      img.onload = () => ctx.drawImage(img, S * 0.15, S * 0.05, S * 0.7, S * 0.9);
      img.src = 'assets/ghost.svg';
      card('Player', 'Ghost sprite (SVG)', c);
    };

    // Floor
    card('Floor', 'Stone floor tile', renderMesh(TileFactory.createFloor(), { dist: 1.2, y: 1.5, lookY: 0 }));

    // Wall
    card('Wall', 'Brick wall (side + top)', renderMesh(TileFactory.createWall(), { dist: 2, y: 1.5, lookY: 0.4 }));

    // Box
    card('Box', 'Brown crate — 3 tone faces', renderMesh(TileFactory.createBox(false), { dist: 1.8, y: 1.2, lookY: 0.3 }));

    // Green Box (on target)
    card('Green Box', 'Box on target — green tint', renderMesh(TileFactory.createBox(true), { dist: 1.8, y: 1.2, lookY: 0.3 }));

    // Target floor
    card('Green Floor', 'Target tile', renderMesh(TileFactory.createTarget(), { dist: 1.2, y: 1.5, lookY: 0 }));

    playerCard();
  </script>
</body>
</html>
